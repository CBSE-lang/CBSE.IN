<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Admin Login</h2>

<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

<hr>

<h2>Add Student</h2>

<input id="nameInput" placeholder="Student Name"><br>
<input id="fatherInput" placeholder="Father Name"><br>
<input id="rollInput" placeholder="Roll"><br>
<input type="date" id="dobInput"><br>

<input id="mathsInput" placeholder="Maths"><br>
<input id="engInput" placeholder="English"><br>
<input id="sciInput" placeholder="Science"><br>
<input id="sstInput" placeholder="SST"><br>
<input id="hinInput" placeholder="Hindi"><br>

<button onclick="addStudent()">Save</button>

<script src="script.js"></script>
</body>
</html>
